# Geliştirme ortamı — Windows ve macOS'ta aynı şekilde çalışır.
# Java, Maven, Node ve PostgreSQL'in makineye kurulması gerekmez;
# hepsi kap içinde çalışır.
#
#   docker compose up -d db          → yalnızca veritabanı
#   docker compose up                → veritabanı + backend + frontend
#   docker compose down              → durdur (veriler kalır)
#   docker compose down -v           → durdur ve verileri sil

services:
  db:
    image: postgres:16-alpine
    container_name: ${BIDB_ONEK:-bidb}-db
    environment:
      POSTGRES_DB: ${BIDB_DB_AD:-bidb}
      POSTGRES_USER: ${BIDB_DB_KULLANICI:-bidb}
      # Yönetici parolasıyla aynı yaklaşım: varsayılan yalnızca geliştirme
      # içindir, üretimde .env üzerinden verilmelidir. Daha önce sabit
      # yazıldığı için dosyayı düzenlemeden değiştirilemiyordu.
      POSTGRES_PASSWORD: ${BIDB_DB_PAROLA:-bidb}
      # Türkçe sıralama ve karşılaştırma
      LANG: tr_TR.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Yalnızca ana makineden (localhost) erişilebilir — "0.0.0.0:5432" gibi
      # tüm arayüzlere açık bağlamak, güvenlik duvarı yanlış/eksik olduğunda
      # veritabanını doğrudan internete açar. Yerel geliştirme (psql -h
      # localhost) bu bağlamayla hiç etkilenmez.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BIDB_ONEK:-bidb}-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${BIDB_DB_AD:-bidb}
      SPRING_DATASOURCE_USERNAME: ${BIDB_DB_KULLANICI:-bidb}
      SPRING_DATASOURCE_PASSWORD: ${BIDB_DB_PAROLA:-bidb}
      SPRING_PROFILES_ACTIVE: docker
      # Yönetim uçları için kimlik bilgileri (üretimde mutlaka değiştirilmeli)
      BIDB_YONETICI_KULLANICI: ${BIDB_YONETICI_KULLANICI:-admin}
      BIDB_YONETICI_PAROLA: ${BIDB_YONETICI_PAROLA:-admin}
      # Kurumsal e-posta sunucusunun parolası. Sunucu adresi, kapı, gönderen
      # ve güvenlik kipi panelden yönetilir; PAROLA bilinçli olarak yalnızca
      # burada durur. Veritabanında tutulsaydı yedeklere, göç dökümlerine ve
      # panel yanıtlarına düşerdi. Tanımlı değilse kimlik doğrulamalı gönderim
      # açılamaz; panel bunu "tanımlı değil" diye gösterir.
      BIDB_MAIL_PAROLA: ${BIDB_MAIL_PAROLA:-}
      # Panelden yüklenen belgeler burada durur; ön yüz aynı birimi okur
      BIDB_DOSYA_DIZINI: /veri/dosyalar
      # Ön yüz vekilinin kimliğini kanıtlayan paylaşılan sır (frontend ile aynı
      # değer). Tanımlıysa yalnızca doğru anahtarı taşıyan isteklerin bildirdiği
      # istemci adresi kabul edilir — bkz. IstemciAdresi.
      BIDB_VEKIL_ANAHTARI: ${BIDB_VEKIL_ANAHTARI:-}
    volumes:
      - belgeler:/veri/dosyalar
    ports:
      # 8080 geliştirme makinesinde başka bir servis tarafından kullanılabildiği için
      # dışarıya 8081 açılır; kap içi haberleşme yine 8080 üzerindendir.
      # Yalnızca ana makineden erişilebilir — backend'e doğrudan (Node vekil
      # sunucusunu atlayarak) dışarıdan ulaşılabilmesi hem CSP gibi güvenlik
      # başlıklarını hem de gerçek istemci IP'sini çözen X-Forwarded-For
      # zincirini devre dışı bırakırdı (bkz. server.ts, YoneticiGirisSinirlayici).
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${BIDB_ONEK:-bidb}-frontend
    depends_on:
      - backend
    environment:
      BIDB_API: http://backend:8080
      ALLOWED_HOSTS: localhost,127.0.0.1,bidb.hacettepe.edu.tr
      # Backend'in, iletilen gerçek istemci adresine güvenmesi için bu vekilin
      # kimliğini kanıtlayan paylaşılan sır. İki serviste de AYNI değer olmalı.
      # Üretimde mutlaka rastgele bir değere ayarlanmalıdır; tanımsız
      # bırakılırsa backend ara sunucuya ağ konumuna göre güvenir (bkz.
      # IstemciAdresi) — bu, backend'e doğrudan erişebilen bir sürecin sahte
      # istemci adresi bildirmesini engellemez.
      BIDB_VEKIL_ANAHTARI: ${BIDB_VEKIL_ANAHTARI:-}
    volumes:
      # Panelden yüklenen belgeler (backend yazar, ön yüz sunar)
      - belgeler:/veri/dosyalar:ro
    ports:
      - "4000:4000"

volumes:
  belgeler:
  db-data:
