spring:
  servlet:
    multipart:
      # Panelden yüklenen belgeler için üst sınır (denetim ayrıca kodda da yapılır)
      max-file-size: 25MB
      max-request-size: 26MB
  application:
    name: bidb-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bidb}
    username: ${SPRING_DATASOURCE_USERNAME:bidb}
    password: ${SPRING_DATASOURCE_PASSWORD:bidb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # şema Flyway ile yönetilir
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  # Angular sunucu tarafı render'ı bu servisi çağırır.
  #
  # "framework" stratejisi KASITLI OLARAK kapalıdır: o strateji getRemoteAddr()'ı
  # X-Forwarded-For zincirinin İLK adımına göre yeniden yazar. O adım her zaman
  # istemcinin kendi yazdığı, doğrulanmamış değerdir; açık kaldığında gerçek TCP
  # karşı tarafı öğrenilemez hâle geliyor ve adrese dayanan bütün korumalar
  # (yönetici kaba kuvvet sınırı dâhil) sahte başlıkla atlatılabiliyordu.
  # İstemci adresi artık güvenilir vekil denetimiyle çözülür — bkz. IstemciAdresi.
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Geliştirmede Angular (4200) farklı porttan çağırır
bidb:
  yonetici:
    kullanici: ${BIDB_YONETICI_KULLANICI:yonetici}
    parola: ${BIDB_YONETICI_PAROLA:}
  cors:
    izinli-adresler: ${BIDB_CORS:http://localhost:4200,http://127.0.0.1:4200}
  # Panelden yüklenen belgelerin yazıldığı dizin; ön yüz aynı dizini sunar
  dosya-dizini: ${BIDB_DOSYA_DIZINI:/veri/dosyalar}
  # Gerçek istemci adresinin çözümü (kaba kuvvet ve hız sınırları buna dayanır).
  # bkz. IstemciAdresi
  guvenilir-vekiller: ${BIDB_GUVENILIR_VEKILLER:}
  # Ön yüzle backend arasındaki ara sunucu adımı sayısı; önde ayrıca bir ters
  # vekil (nginx vb.) varsa artırılmalıdır.
  vekil-adim-sayisi: ${BIDB_VEKIL_ADIM_SAYISI:1}
  # Ara sunucunun kimliğini kanıtlayan paylaşılan sır; tanımlıysa iletilen
  # istemci adresi yalnızca doğru anahtarla kabul edilir.
  vekil-anahtari: ${BIDB_VEKIL_ANAHTARI:}
